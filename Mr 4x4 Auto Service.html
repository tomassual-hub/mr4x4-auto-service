<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr 4x4 Auto Service — Sistem Pengurusan Bengkel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg: #1B1D21;
  --panel: #24272C;
  --panel-alt: #2C3036;
  --panel-solid: #202226;
  --paper: #F1ECE1;
  --paper-ink: #2b2822;
  --paper-line: rgba(30,28,22,.14);
  --accent: #F2A73B;
  --accent-ink: #20200f;
  --accent-2: #E8622C;
  --danger: #E14B4B;
  --success: #4FA579;
  --text: #ECE8DE;
  --text-muted: #9A9FA6;
  --border: #383D45;
  --shadow: rgba(0,0,0,.35);
  --backdrop: rgba(8,9,10,.6);
}
html[data-theme="light"]{
  --bg: #E7E9EC;
  --panel: #FFFFFF;
  --panel-alt: #F1F3F5;
  --panel-solid: #F1F3F5;
  --paper: #FBF8F2;
  --paper-ink: #2b2822;
  --paper-line: rgba(30,28,22,.14);
  --accent: #E0912E;
  --accent-ink: #211a08;
  --accent-2: #D6551F;
  --danger: #D33F3F;
  --success: #2F8F5B;
  --text: #1D2024;
  --text-muted: #6B7280;
  --border: #DADFE4;
  --shadow: rgba(30,35,45,.12);
  --backdrop: rgba(30,33,38,.45);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;transition:background-color .25s ease,color .25s ease;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#3d434c;border-radius:4px;}
.sidebar,.panel,.stat-card,.topbar,.job-ticket,input,select,textarea,.tab-btn,.nav-item,.pos-item,.staff-card{transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,transform .15s ease;}

.app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:220px;flex-shrink:0;background:var(--panel-solid);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:22px 20px 16px;border-bottom:1px dashed var(--border);}
.brand-mark{font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1.25;color:var(--accent);display:flex;align-items:center;gap:8px;}
.brand-mark svg{flex-shrink:0;}
.brand-sub{font-size:11px;color:var(--text-muted);margin-top:4px;letter-spacing:1.5px;text-transform:uppercase;}
.nav{padding:14px 10px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:6px;
  color:var(--text-muted);cursor:pointer;font-size:13.5px;font-weight:600;margin-bottom:2px;
  border-left:3px solid transparent;transition:background .12s;
}
.nav-item:hover{background:var(--panel-alt);color:var(--text);}
.nav-item.active{background:var(--panel-alt);color:var(--accent);border-left-color:var(--accent);}
.nav-item svg{flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--accent-2);color:#1a1a1a;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px;}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;}
.topbar{
  padding:20px 28px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  background:var(--panel);position:sticky;top:0;z-index:5;
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
.topbar h1{font-family:'Oswald',sans-serif;font-size:19px;margin:0;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .date{font-size:12px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;}
.content{padding:26px 28px 60px;}

.hamburger-btn{display:none;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;color:var(--text);flex-shrink:0;}
.theme-toggle{background:var(--panel-alt);border:1px solid var(--border);border-radius:20px;padding:6px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:4px;flex-shrink:0;}
.theme-toggle .t-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.theme-toggle .t-icon.active{background:var(--accent);color:var(--accent-ink);}
.theme-toggle .t-icon:not(.active){color:var(--text-muted);}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:var(--backdrop);z-index:40;}

@media(max-width:880px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .28s ease;z-index:50;box-shadow:12px 0 32px var(--shadow);}
  .sidebar.nav-open{transform:translateX(0);}
  .hamburger-btn{display:flex;align-items:center;justify-content:center;}
  .sidebar-backdrop.show{display:block;}
  .topbar{padding:16px 16px;}
  .topbar h1{font-size:16.5px;}
  .topbar .date{display:none;}
  .content{padding:16px 16px 50px;}
  .user-name,.user-role{display:none;}
}
@media(max-width:600px){
  .grid-4,.grid-3{grid-template-columns:1fr 1fr;}
  .stat-value{font-size:22px;}
  .section-head{flex-direction:column;align-items:flex-start;}
  .section-head button{width:100%;justify-content:center;}
  .tickets{grid-template-columns:1fr;}
  .modal{max-width:100%;border-radius:14px 14px 0 0;position:fixed;bottom:0;left:0;margin:0;max-height:92vh;}
  .modal-overlay{align-items:flex-end;padding:0;}
  .field-row{grid-template-columns:1fr;}
  .table-wrap{overflow-x:auto;}
  .staff-grid{grid-template-columns:1fr;}
}

/* ---------- SHARED UI ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:2fr 1fr;}
@media(max-width:1000px){.grid-4,.grid-3{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}

.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden;box-shadow:0 1px 3px var(--shadow);}
.stat-card:hover{box-shadow:0 6px 20px var(--shadow);transform:translateY(-1px);}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent);}
.stat-card.warn::before{background:var(--danger);}
.stat-card.ok::before{background:var(--success);}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:600;}
.stat-value{font-family:'Oswald',sans-serif;font-size:28px;margin-top:6px;font-weight:600;}
.stat-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 1px 3px var(--shadow);}
.panel h2{font-family:'Oswald',sans-serif;font-size:15px;margin:0 0 14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;}
.panel h2 .tag{font-size:10px;background:var(--panel-alt);color:var(--text-muted);padding:2px 7px;border-radius:4px;font-family:'IBM Plex Mono',monospace;}

.btn{
  border:none;border-radius:6px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;
  font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px;transition:filter .1s,transform .1s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--panel-alt);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.btn-danger:hover{background:rgba(225,75,75,.12);}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-icon{padding:7px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text-muted);cursor:pointer;}
.btn-icon:hover{color:var(--text);background:var(--panel-alt);}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.section-head h1{font-family:'Oswald',sans-serif;font-size:22px;margin:0;font-weight:600;}
.section-head .sub{font-size:12.5px;color:var(--text-muted);margin-top:3px;}

input,select,textarea{
  background:var(--panel-alt);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:9px 11px;font-size:13.5px;font-family:'Inter',sans-serif;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:block;margin-bottom:5px;}
.field{margin-bottom:13px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 10px;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);font-weight:600;}
td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.05);}
tr:hover td{background:rgba(255,255,255,.02);}

.pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;letter-spacing:.3px;}
.pill-wait{background:rgba(242,167,59,.18);color:var(--accent);}
.pill-progress{background:rgba(94,158,214,.18);color:#7CB3E0;}
.pill-done{background:rgba(79,165,121,.18);color:var(--success);}
.pill-delivered{background:rgba(154,159,166,.18);color:var(--text-muted);}
.pill-low{background:rgba(225,75,75,.18);color:var(--danger);}
.pill-paid{background:rgba(79,165,121,.18);color:var(--success);}
.pill-unpaid{background:rgba(225,75,75,.18);color:var(--danger);}

/* ---------- JOB TICKET (signature element) ---------- */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.job-ticket{
  background:var(--paper);color:#2b2822;border-radius:4px 14px 14px 4px;
  padding:16px 18px 16px 36px;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.35);
  cursor:pointer;transition:transform .12s;
}
.job-ticket:hover{transform:translateY(-2px);}
.job-ticket::before{
  content:'';position:absolute;left:13px;top:22px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);
}
.job-ticket::after{
  content:'';position:absolute;left:18px;top:38px;bottom:14px;border-left:2px dashed rgba(0,0,0,.16);
}
.jt-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.jt-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b6555;font-weight:600;}
.jt-plate{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;background:#2b2822;color:#F1ECE1;
  padding:3px 8px;border-radius:3px;letter-spacing:1px;display:inline-block;
}
.jt-model{font-size:12.5px;color:#5c5748;margin-top:5px;font-weight:600;}
.jt-desc{font-size:12.5px;color:#454138;margin:9px 0;line-height:1.5;min-height:20px;}
.jt-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px dashed var(--paper-line);}
.jt-mechanic{font-size:11.5px;color:#6b6555;}
.jt-stripe{position:absolute;top:0;right:0;width:26px;height:100%;background:repeating-linear-gradient(-45deg,var(--accent),var(--accent) 6px,#2b2822 6px,#2b2822 12px);opacity:.85;border-radius:0 14px 14px 0;}
.jt-stripe.st-progress{background:repeating-linear-gradient(-45deg,#7CB3E0,#7CB3E0 6px,#2b2822 6px,#2b2822 12px);}
.jt-stripe.st-done{background:repeating-linear-gradient(-45deg,var(--success),var(--success) 6px,#2b2822 6px,#2b2822 12px);}
.jt-stripe.st-delivered{background:repeating-linear-gradient(-45deg,#9A9FA6,#9A9FA6 6px,#2b2822 6px,#2b2822 12px);}

.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{padding:8px 14px;border-radius:6px;background:var(--panel-alt);color:var(--text-muted);border:1px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer;}
.tab-btn.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(2px);
}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:24px;box-shadow:0 16px 48px var(--shadow);animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal h2{font-family:'Oswald',sans-serif;margin:0 0 18px;font-size:17px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}

.empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty svg{opacity:.4;margin-bottom:10px;}

/* ---------- POS ---------- */
.pos-wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media(max-width:1000px){.pos-wrap{grid-template-columns:1fr;}}
.pos-item{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;}
.pos-item:hover{border-color:var(--accent);background:var(--panel-alt);}
.pos-item .n{font-weight:600;font-size:13.5px;}
.pos-item .m{font-size:11.5px;color:var(--text-muted);}
.pos-item .p{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-weight:600;}

.receipt{background:var(--paper);color:#2b2822;border-radius:6px;padding:18px;font-family:'IBM Plex Mono',monospace;}
.receipt-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;}
.receipt-line{border-top:1px dashed var(--paper-line);margin:8px 0;}
.receipt-total{font-weight:700;font-size:15px;}
.cart-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--paper-line);}
.cart-row .qty-btn{width:20px;height:20px;border-radius:4px;background:#2b2822;color:var(--paper);border:none;cursor:pointer;font-weight:700;font-size:12px;}

.search-box{position:relative;margin-bottom:12px;}
.search-box input{padding-left:34px;}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);}

.chart-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.chart-bar-label{width:130px;font-size:12px;color:var(--text-muted);flex-shrink:0;}
.chart-bar-track{flex:1;background:var(--panel-alt);border-radius:4px;height:20px;overflow:hidden;}
.chart-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:4px;}
.chart-bar-val{width:80px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;flex-shrink:0;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--success);color:#0e2117;padding:12px 18px;border-radius:8px;font-weight:600;font-size:13px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:slideIn .25s ease;}
@keyframes slideIn{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-muted);font-family:'Oswald',sans-serif;}

/* ---------- LOGIN SCREEN ---------- */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,var(--panel-alt),var(--bg) 65%);padding:20px;}
.login-box{width:100%;max-width:420px;}
.login-brand{text-align:center;margin-bottom:26px;}
.login-brand .mark{font-family:'Oswald',sans-serif;font-weight:700;font-size:21px;line-height:1.3;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:10px;text-align:left;}
.login-brand .sub{font-size:12px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-top:6px;}
.staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px;}
.staff-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 14px;text-align:center;cursor:pointer;transition:border-color .12s,transform .12s;}
.staff-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.staff-avatar{width:44px;height:44px;border-radius:50%;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;color:var(--accent);}
.staff-name{font-weight:600;font-size:13.5px;}
.staff-role{font-size:11px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.pin-key{padding:16px;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;cursor:pointer;color:var(--text);}
.pin-key:hover{border-color:var(--accent);}

/* ---------- USER BADGE ---------- */
.user-badge{display:flex;align-items:center;gap:10px;}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;color:var(--accent);border:1px solid var(--border);}
.user-name{font-size:12.5px;font-weight:600;line-height:1.2;}
.user-role{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}

/* ---------- PRINT INVOICE ---------- */
#print-area{display:none;}
.print-invoice{background:#fff;color:#1a1a1a;padding:36px;font-family:'IBM Plex Mono',monospace;max-width:480px;margin:0 auto;}
.print-invoice h2{font-family:'Oswald',sans-serif;margin:0 0 2px;font-size:20px;}
.print-invoice .pi-sub{font-size:11px;color:#666;margin-bottom:18px;}
.print-invoice .pi-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
.print-invoice .pi-line{border-top:1px dashed #999;margin:10px 0;}
.print-invoice table{width:100%;font-size:12px;border-collapse:collapse;}
.print-invoice th{text-align:left;border-bottom:1px solid #333;padding:5px 4px;font-size:10.5px;text-transform:uppercase;}
.print-invoice td{padding:6px 4px;border-bottom:1px dashed #ccc;}
.print-invoice .pi-total{font-weight:700;font-size:16px;}
.print-invoice .pi-foot{text-align:center;font-size:11px;color:#666;margin-top:20px;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{display:block;position:absolute;left:0;top:0;width:100%;}
}

/* ---------- CONFIRM MODAL ---------- */
.confirm-box{max-width:380px;text-align:center;}
.confirm-box .c-icon{width:46px;height:46px;border-radius:50%;background:rgba(225,75,75,.15);color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.confirm-box p{font-size:13.5px;color:var(--text-muted);margin:0 0 20px;}
.confirm-box .modal-foot{justify-content:center;}

/* ---------- VEHICLE HISTORY TIMELINE ---------- */
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);}
.timeline-item{position:relative;margin-bottom:16px;}
.timeline-item::before{content:'';position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);}
.timeline-date{font-size:11px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;}
.timeline-title{font-weight:600;font-size:13.5px;margin:2px 0;}
.timeline-desc{font-size:12.5px;color:var(--text-muted);}
.clickable{cursor:pointer;}
.clickable:hover{color:var(--accent);}

/* ---------- GLOBAL SEARCH ---------- */
.global-search-wrap{position:relative;flex:1;max-width:360px;margin:0 14px;}
.global-search-wrap .search-box input{background:var(--panel-alt);}
.global-search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px var(--shadow);z-index:60;max-height:360px;overflow-y:auto;}
.gs-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);}
.gs-item:last-child{border-bottom:none;}
.gs-item:hover{background:var(--panel-alt);}
.gs-type{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);background:var(--panel-alt);padding:3px 7px;border-radius:5px;flex-shrink:0;}
.gs-label{font-size:13px;font-weight:600;}
.gs-sub{font-size:11px;color:var(--text-muted);}
.gs-empty{padding:14px;font-size:12.5px;color:var(--text-muted);text-align:center;}
@media(max-width:880px){.global-search-wrap{display:none;}}
.notif-wrap{position:relative;}
.notif-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
</style>

const STORAGE_KEY = 'workshop-db';
let db = null;
let saveTimer = null;
const loginAttempts = {}; // session-only: {staffId: {count, lockedUntil}}
let inactivityTimer = null;
const INACTIVITY_LOCK_MS = 5*60*1000; // auto-lock after 5 minutes of no interaction
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  if(!state.currentStaff || state.kioskMode) return;
  inactivityTimer = setTimeout(()=>{
    if(state.currentStaff){
      state.currentStaff = null;
      state.modal = null;
      state.confirmAction = null;
      render();
      showToast(tt('Sesi tamat kerana tidak aktif. Sila log masuk semula.'));
    }
  }, INACTIVITY_LOCK_MS);
}

function defaultDB(){
  return {
    customers: [],
    vehicles: [],
    jobs: [],
    inventory: [],
    invoices: [],
    staff: [],
    appointments: [],
    contracts: [],
    suppliers: [],
    purchaseOrders: [],
    auditLog: [],
    branches: [{id:'main', name:'Cawangan Utama'}],
    cashClosures: [],
    settings: { shopName:'Mr 4x4 Auto Service', shopPhone:'', taxRate:0, loyaltyVisits:5, loyaltyDiscount:10, churnDays:180, simpleMode:false, paymentQR:'', lastBackupAt:null },
    counters: { job: 1, invoice: 1, po: 1 }
  };
}

async function loadDB(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    db = res ? JSON.parse(res.value) : seedDB();
  }catch(e){
    db = seedDB();
  }
  // migration safety for DBs saved before newer fields existed
  if(!db.staff) db.staff = [];
  if(db.staff.length===0){
    db.staff.push({id:uid(), name:'Admin', role:'Admin', pin:'1234'});
  }
  if(!db.appointments) db.appointments = [];
  if(!db.contracts) db.contracts = [];
  if(!db.settings) db.settings = { shopName:'Mr 4x4 Auto Service', shopPhone:'', taxRate:0, loyaltyVisits:5, loyaltyDiscount:10 };
  if(db.settings.loyaltyVisits===undefined) db.settings.loyaltyVisits = 5;
  if(db.settings.loyaltyDiscount===undefined) db.settings.loyaltyDiscount = 10;
  if(!db.suppliers) db.suppliers = [];
  if(!db.purchaseOrders) db.purchaseOrders = [];
  if(!db.auditLog) db.auditLog = [];
  if(!db.branches || db.branches.length===0) db.branches = [{id:'main', name:'Cawangan Utama'}];
  if(!db.counters.po) db.counters.po = 1;
  if(!db.cashClosures) db.cashClosures = [];
  if(db.settings.churnDays===undefined) db.settings.churnDays = 180;
  if(db.settings.simpleMode===undefined) db.settings.simpleMode = false;
  if(db.settings.paymentQR===undefined) db.settings.paymentQR = '';
  if(db.settings.lastBackupAt===undefined) db.settings.lastBackupAt = null;
  if(!state.currentBranch) state.currentBranch = 'all';
  try{
    const pref = await window.storage.get('theme-pref', false);
    if(pref && (pref.value==='light' || pref.value==='dark')) state.theme = pref.value;
  }catch(e){ /* no saved preference yet */ }
  try{
    const langPref = await window.storage.get('lang-pref', false);
    if(langPref && (langPref.value==='ms' || langPref.value==='en')) state.language = langPref.value;
  }catch(e){ /* no saved preference yet */ }
  render();
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(db), true); }
    catch(e){ console.error('Gagal simpan data', e); }
  }, 300);
}

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function fmtRM(n){ return 'RM ' + (Number(n)||0).toFixed(2); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(ts){ const d=new Date(ts); return d.toLocaleDateString('ms-MY',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'}); }
function nextJobNo(){ const n = db.counters.job++; return 'WS-'+String(n).padStart(4,'0'); }
function nextInvNo(){ const n = db.counters.invoice++; return 'INV-'+String(n).padStart(4,'0'); }
function nextPoNo(){ const n = db.counters.po++; return 'PO-'+String(n).padStart(4,'0'); }
function logAudit(action, detail){
  db.auditLog.unshift({id:uid(), ts:Date.now(), staff: state.currentStaff?state.currentStaff.name:'?', action, detail});
  if(db.auditLog.length>300) db.auditLog.length = 300;
}

function getCustomer(id){ return db.customers.find(c=>c.id===id); }
function getVehicle(id){ return db.vehicles.find(v=>v.id===id); }
function getVehiclesFor(customerId){ return db.vehicles.filter(v=>v.customerId===customerId); }
function getItem(id){ return db.inventory.find(i=>i.id===id); }
function normalizePhone(phone){
  let p = (phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('0')) p = '6'+p; // Malaysia country code
  return p;
}

function render(){
  document.documentElement.setAttribute('data-theme', state.theme);
  resetInactivityTimer();
  const root = document.getElementById('root');
  if(state.kioskMode){
    root.innerHTML = renderKioskScreen();
    attachKioskHandlers();
    return;
  }
  if(!state.currentStaff){
    root.innerHTML = renderLoginScreen();
    attachLoginHandlers();
    return;
  }
  root.innerHTML = `
    <div class="app">
      ${renderSidebar()}
      <div class="sidebar-backdrop ${state.navOpen?'show':''}" data-action="close-nav"></div>
      <div class="main">
        ${renderTopbar()}
        <div class="content">${renderView()}</div>
      </div>
    </div>
    ${state.modal ? renderModal() : ''}
    ${state.confirmAction ? renderConfirmModal() : ''}
    ${state.showOnboarding ? renderOnboarding() : ''}
    ${state.toast ? `<div class="toast">${state.toast}${state.toastUndo ? ` <span class="clickable" data-action="undo-delete" style="text-decoration:underline;font-weight:700;margin-left:6px;">Buat Asal</span>` : ''}</div>` : ''}
  `;
  attachHandlers();
}

function renderLoginScreen(){
  if(state.loginTargetId){
    const staffMember = db.staff.find(s=>s.id===state.loginTargetId);
    const filled = state.loginPin.length;
    const att = loginAttempts[staffMember.id];
    const lockedMs = att && att.lockedUntil ? att.lockedUntil - Date.now() : 0;
    const isLocked = lockedMs > 0;
    return `
    <div class="login-screen">
      <div class="login-box">
        <div class="login-brand">
          <div class="mark"><img src="${LOGO_DATA_URI}" alt="Mr 4x4 Auto Service" style="height:64px;width:auto;display:block;margin:0 auto;"></div>
        </div>
        <div class="panel" style="text-align:center;">
          <div class="staff-avatar" style="width:52px;height:52px;font-size:19px;">${initials(staffMember.name)}</div>
          <div class="staff-name" style="margin-top:8px;">${staffMember.name}</div>
          <div class="staff-role">${staffMember.role}</div>
          ${isLocked ? `
          <div style="margin:18px 0;padding:14px;background:rgba(225,75,75,.12);border-radius:8px;">
            <div style="color:var(--danger);font-weight:600;font-size:13px;">${ICONS.alert} Akaun Dikunci Sementara</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Terlalu banyak percubaan PIN salah. Cuba lagi dalam ${Math.ceil(lockedMs/1000)} saat.</div>
          </div>
          <div class="pin-key" data-pin="cancel" style="max-width:120px;margin:0 auto;">${ICONS.x} Batal</div>
          ` : `
          <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="pin-dot ${i<filled?'filled':''}"></div>`).join('')}</div>
          ${att && att.count>0 ? `<div style="font-size:11.5px;color:var(--danger);margin-bottom:4px;">PIN salah (${att.count}/5 percubaan)</div>` : ''}
          <div class="pin-pad">
            ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="pin-key" data-pin="${n}">${n}</div>`).join('')}
            <div class="pin-key" data-pin="back">${ICONS.backspace}</div>
            <div class="pin-key" data-pin="0">0</div>
            <div class="pin-key" data-pin="cancel">${ICONS.x}</div>
          </div>`}
        </div>
      </div>
    </div>`;
  }
  return `
  <div class="login-screen">
    <div class="login-box">
      <div class="login-brand">
        <div class="mark"><img src="${LOGO_DATA_URI}" alt="Mr 4x4 Auto Service" style="height:64px;width:auto;display:block;margin:0 auto;"></div>

      </div>
      <div class="staff-grid">
        ${db.staff.map(s=>`
          <div class="staff-card" data-staff-login="${s.id}">
            <div class="staff-avatar">${initials(s.name)}</div>
            <div class="staff-name">${s.name}</div>
            <div class="staff-role">${s.role}</div>
          </div>`).join('')}
      </div>
      <div style="text-align:center;margin-top:18px;">
        <span class="clickable" data-action="open-kiosk" style="font-size:12.5px;color:var(--text-muted);text-decoration:underline;">${ICONS.gauge} ${t('kiosk_link')}</span>
      </div>

function initials(name){
  return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function attachLoginHandlers(){
  const kioskLink = document.querySelector('[data-action="open-kiosk"]');
  if(kioskLink) kioskLink.addEventListener('click', ()=>{ state.kioskMode=true; state.kioskQuery=''; render(); });
  document.querySelectorAll('[data-staff-login]').forEach(el=>el.addEventListener('click', ()=>{
    state.loginTargetId = el.dataset.staffLogin;
    state.loginPin = '';
    render();
  }));
  document.querySelectorAll('[data-pin]').forEach(el=>el.addEventListener('click', ()=>{
    const v = el.dataset.pin;
    if(v==='cancel'){ state.loginTargetId=null; state.loginPin=''; render(); return; }
    if(v==='back'){ state.loginPin = state.loginPin.slice(0,-1); render(); return; }
    const att = loginAttempts[state.loginTargetId];
    if(att && att.lockedUntil && att.lockedUntil>Date.now()) return;
    if(state.loginPin.length>=4) return;
    state.loginPin += v;
    if(state.loginPin.length===4){
      const staffMember = db.staff.find(s=>s.id===state.loginTargetId);
      if(staffMember.pin===state.loginPin){
        delete loginAttempts[staffMember.id];
        state.currentStaff = staffMember;
        state.loginTargetId = null; state.loginPin='';
        checkOnboarding();
        render();
        showToast(tt('Selamat kembali, ')+staffMember.name+'!');
      } else {
        if(!loginAttempts[staffMember.id]) loginAttempts[staffMember.id] = {count:0, lockedUntil:0};
        loginAttempts[staffMember.id].count++;
        if(loginAttempts[staffMember.id].count>=5){
          loginAttempts[staffMember.id].lockedUntil = Date.now()+30000;
          loginAttempts[staffMember.id].count = 0;
          startLockoutTicker();
        }
        setTimeout(()=>{ state.loginPin=''; render(); showToast(tt('PIN salah, cuba lagi.')); }, 150);
        render();
      }
    } else render();
  }));
}

let lockoutTicker = null;
function startLockoutTicker(){
  if(lockoutTicker) return;
  lockoutTicker = setInterval(()=>{
    if(!state.loginTargetId || state.currentStaff){ clearInterval(lockoutTicker); lockoutTicker=null; return; }
    const att = loginAttempts[state.loginTargetId];
    if(!att || !att.lockedUntil || att.lockedUntil<=Date.now()){ clearInterval(lockoutTicker); lockoutTicker=null; }
    render();
  }, 1000);
}

function renderKioskScreen(){
  const q = (state.kioskQuery||'').trim();
  let result = null;
  if(q){
    const ql = q.toLowerCase();
    const job = db.jobs.find(j=>j.jobNo.toLowerCase()===ql) ||
      [...db.jobs].reverse().find(j=>{ const v=getVehicle(j.vehicleId); return v && v.plate.toLowerCase().replace(/\s/g,'')===ql.replace(/\s/g,''); });
    result = job || 'notfound';
  }
  const statusLabel = {waiting:'Menunggu Giliran', progress:'Sedang Dikerjakan', done:'Siap, Sedia Diambil', delivered:'Telah Dihantar'};
  const statusDesc = {
    waiting:'Kenderaan anda telah didaftarkan dan sedang menunggu giliran mekanik.',
    progress:'Mekanik kami sedang mengerjakan kenderaan anda sekarang.',
    done:'Kerja telah siap! Kenderaan anda sedia untuk diambil.',
    delivered:'Kenderaan telah dihantar/diambil. Terima kasih kerana menggunakan perkhidmatan kami.'
  };
  return `
  <div class="login-screen">
    <div class="login-box">
      <div class="login-brand">
        <div class="mark"><img src="${LOGO_DATA_URI}" alt="Mr 4x4 Auto Service" style="height:64px;width:auto;display:block;margin:0 auto;"></div>
        <div class="sub">Semak Status Kenderaan</div>
      </div>
      <div class="panel">
        <div class="field"><label>No. Kad Kerja atau No. Plat</label>
          <input id="kiosk-input" placeholder="cth: WS-0001 atau WXY 1234" value="${state.kioskQuery||''}">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="kiosk-check">${ICONS.search} Semak Status</button>
        ${result==='notfound' ? `<div class="empty" style="padding:20px 0 0;">Tiada rekod dijumpai. Sila semak semula no. kad kerja / plat.</div>` : ''}
        ${result && result!=='notfound' ? (()=>{
          const v = getVehicle(result.vehicleId);
          return `
          <div style="margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);">${result.jobNo}</div>
            <div style="font-size:16px;font-weight:700;margin:4px 0;">${v?v.plate:'-'} ${v?'· '+v.model:''}</div>
            <span class="pill pill-${result.status==='waiting'?'wait':result.status}">${statusLabel[result.status]}</span>
            <p style="font-size:12.5px;color:var(--text-muted);margin-top:12px;">${statusDesc[result.status]}</p>
          </div>
          ${result.status==='delivered' ? renderKioskFeedback(result) : ''}`;
        })() : ''}
        <div style="text-align:center;margin-top:18px;">
          <span class="clickable" data-action="close-kiosk" style="font-size:12px;color:var(--text-muted);text-decoration:underline;">← Kembali ke Log Masuk Staf</span>
        </div>
      </div>
    </div>
  </div>`;
}

function renderKioskFeedback(job){
  if(job.rating){
    return `<div style="margin-top:14px;padding:12px;background:rgba(79,165,121,.12);border-radius:8px;text-align:center;">
      <div style="font-size:20px;">${'⭐'.repeat(job.rating)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Terima kasih atas maklum balas anda!</div>
    </div>`;
  }
  const rating = state.kioskRatingValue||0;
  return `
  <div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);">
    <label style="display:block;margin-bottom:8px;">Bagaimana perkhidmatan kami?</label>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px;">
      ${[1,2,3,4,5].map(n=>`<span class="clickable" data-kiosk-star="${n}" style="font-size:26px;filter:${n<=rating?'none':'grayscale(1) opacity(0.4)'};">⭐</span>`).join('')}
    </div>
    <textarea id="kiosk-feedback-text" rows="2" placeholder="Ulasan (pilihan)"></textarea>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" data-action="submit-feedback" data-id="${job.id}">Hantar Maklum Balas</button>
  </div>`;
}

function attachKioskHandlers(){
  bindAction('close-kiosk', ()=>{ state.kioskMode=false; state.kioskQuery=''; state.kioskRatingValue=0; render(); });
  bindAction('kiosk-check', ()=>{
    state.kioskQuery = document.getElementById('kiosk-input').value;
    render();
  });
  const kInput = document.getElementById('kiosk-input');
  if(kInput) kInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ state.kioskQuery = kInput.value; render(); }
  });
  document.querySelectorAll('[data-kiosk-star]').forEach(el=>el.addEventListener('click', ()=>{
    state.kioskRatingValue = Number(el.dataset.kioskStar);
    render();
  }));
  bindAllAction('submit-feedback', el=>{
    const job = db.jobs.find(j=>j.id===el.dataset.id);
    if(!job || !state.kioskRatingValue) return;
    job.rating = state.kioskRatingValue;
    job.feedback = document.getElementById('kiosk-feedback-text').value.trim();
    queueSave();
    state.kioskRatingValue = 0;
    render();
  });
}

function finishOnboarding(){
  state.showOnboarding = false;
  render();
  try{ window.storage.set('onboarding-seen', '1', false); }catch(e){}
}

async function checkOnboarding(){
  try{
    await window.storage.get('onboarding-seen', false);
    // key exists -> already seen before, do nothing
  }catch(e){
    state.showOnboarding = true;
    state.onboardingStep = 0;
    render();
  }
}

function renderOnboarding(){
  const steps = getOnboardingSteps();
  const step = steps[state.onboardingStep];
  const isLast = state.onboardingStep === steps.length-1;
  const en = state.language==='en';
  return `<div class="modal-overlay" style="z-index:150;">
    <div class="modal" style="max-width:380px;text-align:center;">

function getNotifications(){
  const out = [];
  const now = Date.now();
  const lowStock = db.inventory.filter(i=>i.qty<=i.lowStock);
  if(lowStock.length>0) out.push({tag:'Stok', label:lowStock.length+' item stok rendah', sub:lowStock.slice(0,3).map(i=>i.name).join(', '), view:'inventory', urgent:true});
  const todayStr = new Date().toISOString().slice(0,10);
  const todayAppts = db.appointments.filter(a=>a.status==='scheduled' && a.date===todayStr);
  if(todayAppts.length>0) out.push({tag:'Tempahan', label:todayAppts.length+' tempahan hari ini', sub:todayAppts.map(a=>a.time).join(', '), view:'appointments', urgent:false});
  const overdueContracts = db.contracts.filter(c=>c.nextDue<=now);
  if(overdueContracts.length>0) out.push({tag:'Kontrak', label:overdueContracts.length+' kontrak tertunggak', sub:overdueContracts.map(c=>c.label).join(', '), view:'appointments', urgent:true});
  const sizeBytes = JSON.stringify(db).length;
  const sizeMB = sizeBytes/1024/1024;
  if(sizeMB >= 4){
    const en = state.language==='en';
    out.push({
      tag: en?'Storage':'Storan',
      label: en?`Data is ${sizeMB.toFixed(1)}MB (limit ~5MB)`:`Data sudah ${sizeMB.toFixed(1)}MB (had ~5MB)`,
      sub: en?'Delete old photos or export/archive old invoices soon.':'Padam gambar lama atau eksport/arkibkan invois lama tidak lama lagi.',
      view:'settings', urgent:true
    });
  }
  const lastBackup = db.settings.lastBackupAt;
  const daysSinceBackup = lastBackup ? Math.floor((now-lastBackup)/86400000) : null;
  if(!lastBackup || daysSinceBackup>=7){
    const en = state.language==='en';
    out.push({
      tag: en?'Backup':'Sandaran',
      label: !lastBackup ? (en?'No backup yet':'Belum pernah disandarkan') : (en?`Last backup ${daysSinceBackup} day(s) ago`:`Sandaran terakhir ${daysSinceBackup} hari lalu`),
      sub: en?'Download a backup from Settings to avoid losing data.':'Muat turun sandaran dari Tetapan untuk elak kehilangan data.',
      view:'settings', urgent: !lastBackup || daysSinceBackup>=14
    });
  }
  return out;
}

function globalSearchResults(q){
  const ql = q.toLowerCase();
  const out = [];
  db.customers.forEach(c=>{
    if(c.name.toLowerCase().includes(ql) || (c.phone||'').includes(ql)){
      out.push({typeLabel:'Pelanggan', label:c.name, sub:c.phone||'-', action:{type:'customer', id:c.id}});
    }
  });
  db.vehicles.forEach(v=>{
    if(v.plate.toLowerCase().includes(ql)){
      const c = getCustomer(v.customerId);
      out.push({typeLabel:'Kenderaan', label:v.plate, sub:(v.model||'')+' · '+(c?c.name:'-'), action:{type:'vehicle', id:v.id}});
    }
  });
  db.jobs.forEach(j=>{
    if(j.jobNo.toLowerCase().includes(ql)){
      const v = getVehicle(j.vehicleId);
      out.push({typeLabel:'Kad Kerja', label:j.jobNo, sub:v?v.plate:'-', action:{type:'job', id:j.id}});
    }
  });
  db.invoices.forEach(inv=>{
    if(inv.invoiceNo.toLowerCase().includes(ql)){
      const c = getCustomer(inv.customerId);
      out.push({typeLabel:'Invois', label:inv.invoiceNo, sub:(c?c.name:'Walk-in')+' · '+fmtRM(inv.total), action:{type:'invoice', id:inv.id}});
    }
  });
  return out.slice(0,8);
}

  const waitingJobs = db.jobs.filter(j=>j.status==='waiting');
  const lowStock = db.inventory.filter(i=>i.qty<=i.lowStock);

    </div>
  </div>

  <div class="grid grid-2">
    <div class="panel">
      <h2>${tt('Kad Kerja Aktif')} <span class="tag">${activeJobs.length}</span></h2>
      ${activeJobs.length===0 ? emptyState(tt('Tiada kerja aktif buat masa ini.')) : `
      <div class="tickets">${activeJobs.slice(0,4).map(renderJobTicket).join('')}</div>`}
      ${activeJobs.length>0 ? `<div style="margin-top:14px;"><span class="btn btn-outline btn-sm" data-nav="jobs">${tt('Lihat Semua Kad Kerja')}</span></div>` : ''}
    </div>
    <div class="panel">
      <h2>${ICONS.reports} ${tt('Amaran Stok Rendah')}</h2>
      ${lowStock.length===0 ? emptyState(tt('Semua stok mencukupi.')) : lowStock.map(i=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);">
          <div>
            <div style="font-weight:600;font-size:13px;">${i.name}</div>
            <div style="font-size:11.5px;color:var(--text-muted);">${i.sku}</div>
          </div>
          <span class="pill pill-low">${i.qty} ${tt('baki')}</span>
        </div>`).join('')}
      <h2 style="margin-top:22px;">${tt('Invois Terkini')}</h2>
      ${recentInvoices.length===0 ? emptyState(tt('Belum ada invois.')) : recentInvoices.map(inv=>{
        const cust = getCustomer(inv.customerId);
        return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;">
          <span>${inv.invoiceNo} — ${cust?cust.name:tt('Walk-in')}</span>
          <span style="font-family:'IBM Plex Mono',monospace;color:var(--accent);">${fmtRM(inv.total)}</span>
        </div>`;
      }).join('')}
    </div>
  </div>

  ${(()=>{
    const now = Date.now();
    const upcomingAppts = db.appointments.filter(a=>a.status==='scheduled' && (a.date+'T'+a.time) >= new Date().toISOString().slice(0,16)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);
    const overdueContracts = db.contracts.filter(c=>c.nextDue<=now);
    if(upcomingAppts.length===0 && overdueContracts.length===0) return '';
    return `
    <div class="grid grid-2" style="margin-top:20px;">
      <div class="panel">
        <h2>${ICONS.calendar} ${tt('Tempahan Akan Datang')} <span class="tag">${upcomingAppts.length}</span></h2>
        ${upcomingAppts.length===0 ? emptyState(tt('Tiada tempahan dijadualkan.')) : upcomingAppts.map(a=>{
          const c = getCustomer(a.customerId); const v = getVehicle(a.vehicleId);

          </div>`;

      <div class="panel">
        <h2>${ICONS.repeat} ${tt('Kontrak Servis Tertunggak')} <span class="tag">${overdueContracts.length}</span></h2>

          const c = getCustomer(ct.customerId);
          return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;">
            <span>${ct.label} ${c?'· '+c.name:''}</span>

          </div>`;

      </div>
    </div>`;
  })()}
  `;
}

/* ============================= JOB TICKET RENDER ============================= */
function renderJobTicket(j){
  const v = getVehicle(j.vehicleId);
  const c = getCustomer(j.customerId);
  const stripeClass = j.status==='progress'?'st-progress':j.status==='done'?'st-done':j.status==='delivered'?'st-delivered':'';
  const statusLabel = {waiting:tt('Menunggu'), progress:tt('Dalam Proses'), done:tt('Siap'), delivered:tt('Dihantar')}[j.status];
  return `
  <div class="job-ticket" data-job-detail="${j.id}">
    <div class="jt-stripe ${stripeClass}"></div>
    <div class="jt-head">
      <div>
        <div class="jt-num">${j.jobNo} · ${fmtDate(j.createdAt)}</div>
        <div class="jt-plate">${v?v.plate:'—'}</div>
        <div class="jt-model">${v?v.model:'—'}</div>
      </div>
    </div>
    <div class="jt-desc">${j.description || tt('Tiada penerangan')}</div>
    <div class="jt-foot">
      <span class="jt-mechanic">👤 ${j.mechanic||'-'} · ${c?c.name:'-'}</span>
      <span class="pill pill-${j.status==='waiting'?'wait':j.status}">${statusLabel}</span>
    </div>
  </div>`;
}

/* ============================= JOBS VIEW ============================= */
function viewJobs(){
  const filters = [
    {k:'semua', l:tt('Semua')}, {k:'waiting', l:tt('Menunggu')}, {k:'progress', l:tt('Dalam Proses')},
    {k:'done', l:tt('Siap')}, {k:'delivered', l:tt('Dihantar')}
  ];
  const isAdmin = state.currentStaff && state.currentStaff.role==='Admin';
  let jobs = [...db.jobs].sort((a,b)=>b.createdAt-a.createdAt);
  if(state.currentBranch!=='all'){
    jobs = jobs.filter(j=>j.branchId===state.currentBranch || (!j.branchId && state.currentBranch==='main'));
  }
  if(!isAdmin && state.currentStaff){
    jobs = jobs.filter(j=>j.mechanic===state.currentStaff.name || !j.mechanic);
  }
  if(state.jobFilter!=='semua') jobs = jobs.filter(j=>j.status===state.jobFilter);
  const totalJobs = jobs.length;
  const shown = jobs.slice(0, state.jobsShowCount||30);

  return `
  <div class="section-head">
    <div><div class="sub">${isAdmin ? tt('Urus tiket kerja servis seperti bengkel sebenar') : tt('Kad kerja ditugaskan kepada anda')}</div></div>
    <button class="btn btn-primary" data-action="new-job">${ICONS.plus} ${tt('Kad Kerja Baharu')}</button>
  </div>
  <div class="tabs">
    ${filters.map(f=>`<div class="tab-btn ${state.jobFilter===f.k?'active':''}" data-jobfilter="${f.k}">${f.l}</div>`).join('')}
  </div>
  ${shown.length===0 ? emptyState(tt('Tiada kad kerja untuk penapis ini.')) : `<div class="tickets">${shown.map(renderJobTicket).join('')}</div>`}
  ${totalJobs > shown.length ? `<div style="text-align:center;margin-top:18px;">
    <button class="btn btn-outline" data-action="load-more-jobs">${state.language==='en'?'Load More':'Muat Lagi'} (${shown.length}/${totalJobs})</button>
  </div>` : ''}
  `;
}

function viewInventory(){
  const tab = state.invMainTab || 'items';
  let items = [...db.inventory];
  if(state.invTab==='low') items = items.filter(i=>i.qty<=i.lowStock);
  items.sort((a,b)=>a.name.localeCompare(b.name));
  const lowCount = db.inventory.filter(i=>i.qty<=i.lowStock).length;

  const itemsTabHTML = `
  <div class="section-head">
    <div><div class="sub">${tt('Urus stok alat ganti & bekalan bengkel')}</div></div>

  </div>
  <div class="tabs">
    <div class="tab-btn ${state.invTab==='semua'?'active':''}" data-invtab="semua">${tt('Semua')} (${db.inventory.length})</div>

  </div>
  <div class="panel">
    <div class="table-wrap"><table>
      <thead><tr><th>${tt('Nama Item')}</th><th>${tt('SKU')}</th><th>${tt('Kuantiti')}</th><th>${tt('Kos')}</th><th>${tt('Harga Jual')}</th><th>${tt('Pembekal')}</th><th>${tt('Status')}</th><th></th></tr></thead>
      <tbody>
        ${items.length===0 ? `<tr><td colspan="8">${emptyState(tt('Tiada item.'))}</td></tr>` : items.map(i=>{
          const sup = db.suppliers.find(s=>s.id===i.supplierId);
          return `<tr>
            <td style="font-weight:600;">${i.name}</td>
            <td style="font-family:'IBM Plex Mono',monospace;color:var(--text-muted);">${i.sku}</td>

              <button class="btn-icon" data-action="delete-item" data-id="${i.id}">${ICONS.trash}</button>

      </tbody>
    </table></div>
  </div>`;

  const suppliersTabHTML = `

    <div><div class="sub">${tt('Senarai pembekal alat ganti bengkel')}</div></div>
    <button class="btn btn-primary" data-action="new-supplier">${ICONS.plus} ${tt('Pembekal Baharu')}</button>
  </div>
  ${db.suppliers.length===0 ? emptyState(tt('Tiada pembekal direkod.')) : `
  <div class="grid grid-3">
    ${db.suppliers.map(s=>{
      const itemCount = db.inventory.filter(i=>i.supplierId===s.id).length;
      return `<div class="panel">
        <h2>${s.name}</h2>
        <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:6px;">📞 ${s.phone||'-'}</div>
        <div style="font-size:12px;color:var(--text-muted);">${itemCount} ${tt('item dibekalkan')}</div>
        <button class="btn btn-danger btn-sm" style="margin-top:10px;width:100%;" data-action="delete-supplier" data-id="${s.id}">${ICONS.trash} ${tt('Padam')}</button>
      </div>`;
    }).join('')}
  </div>`}
  `;

  const poTabHTML = `
  <div class="section-head">
    <div><div class="sub">${tt('Pesanan belian untuk isi semula stok')}</div></div>
    <button class="btn btn-primary" data-action="new-po">${ICONS.plus} ${tt('Pesanan Baharu')}</button>
  </div>
  ${lowCount>0 ? `<div class="panel" style="margin-bottom:16px;background:rgba(242,167,59,.1);border-color:var(--accent);">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div style="font-size:13px;">${ICONS.alert} ${lowCount} ${tt('item stok rendah — jana pesanan belian automatik?')}</div>
      <button class="btn btn-outline btn-sm" data-action="auto-po">${tt('Jana Pesanan Auto')}</button>
    </div>

  ${db.purchaseOrders.length===0 ? emptyState(tt('Tiada pesanan belian.')) : `
  <div class="panel">
    <div class="table-wrap"><table>
      <thead><tr><th>${tt('No. PO')}</th><th>${tt('Pembekal')}</th><th>${tt('Item')}</th><th>${tt('Jumlah')}</th><th>${tt('Status')}</th><th></th></tr></thead>
      <tbody>
        ${[...db.purchaseOrders].sort((a,b)=>b.createdAt-a.createdAt).map(po=>{
          const sup = db.suppliers.find(s=>s.id===po.supplierId);
          const total = po.items.reduce((s,i)=>s+i.cost*i.qty,0);
          return `<tr>
            <td style="font-family:'IBM Plex Mono',monospace;">${po.poNo}</td>
            <td>${sup?sup.name:'-'}</td>
            <td style="font-size:12px;color:var(--text-muted);">${po.items.map(i=>i.name+' ×'+i.qty).join(', ')}</td>
            <td style="color:var(--accent);font-weight:600;">${fmtRM(total)}</td>
            <td><span class="pill ${po.status==='received'?'pill-done':'pill-wait'}">${po.status==='received'?tt('Diterima'):tt('Belum Diterima')}</span></td>
            <td>${po.status!=='received' ? `<button class="btn-icon" data-action="receive-po" data-id="${po.id}" title="Tandakan diterima & tambah stok">${ICONS.download}</button>` : ''}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`}
  `;

  return `
  ${db.settings.simpleMode ? '' : `
  <div class="tabs">
    <div class="tab-btn ${tab==='items'?'active':''}" data-invmaintab="items">${ICONS.inventory} ${tt('Item')}</div>
    <div class="tab-btn ${tab==='suppliers'?'active':''}" data-invmaintab="suppliers">${ICONS.staff} ${tt('Pembekal')}</div>
    <div class="tab-btn ${tab==='po'?'active':''}" data-invmaintab="po">${ICONS.repeat} ${tt('Pesanan Belian')}</div>
  </div>`}
  ${db.settings.simpleMode ? itemsTabHTML : (tab==='items' ? itemsTabHTML : tab==='suppliers' ? suppliersTabHTML : poTabHTML)}
  `;
}

function viewCustomers(){
  const q = (state.customerSearch||'').toLowerCase();
  let customers = db.customers;
  if(q){
    customers = customers.filter(c=>{
      const vs = getVehiclesFor(c.id);
      return c.name.toLowerCase().includes(q) || (c.phone||'').includes(q) || vs.some(v=>v.plate.toLowerCase().includes(q));
    });
  }
  const totalCustomers = customers.length;
  const shownCustomers = customers.slice(0, state.customersShowCount||30);
  return `
  <div class="section-head">
    <div><div class="sub">${tt('Rekod pelanggan dan kenderaan mereka')}</div></div>

  <div class="grid grid-3">
    ${shownCustomers.map(c=>{
      const vs = getVehiclesFor(c.id);
      const jobCount = db.jobs.filter(j=>j.customerId===c.id).length;
      return `
      <div class="panel">
        <h2>${c.name}
          <button class="btn-icon" style="margin-left:auto;" data-action="edit-customer" data-id="${c.id}">${ICONS.edit}</button>
          <button class="btn-icon" data-action="delete-customer" data-id="${c.id}">${ICONS.trash}</button>
        </h2>
        <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px;">📞 ${c.phone||'-'}  ·  ${jobCount} ${tt('rekod kerja')}</div>
        ${vs.map(v=>`
          <div class="clickable" data-vehicle-history="${v.id}" style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px dashed var(--border);">
            <div>
              <div style="font-weight:600;font-size:13px;">${ICONS.car} ${v.plate}</div>
              <div style="font-size:11.5px;color:var(--text-muted);">${v.model} · ${v.color}</div>
            </div>
            <button class="btn-icon" data-action="edit-vehicle" data-id="${v.id}" title="Sunting kenderaan" onclick="event.stopPropagation()">${ICONS.edit}</button>

  const en = state.language==='en';
  return `
    <h2>${ICONS.history} ${en?'Service History':'Sejarah Servis'} — ${v.plate}</h2>
    <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:16px;">${v.model} · ${v.color||'-'} · ${en?'Owner':'Pemilik'}: ${c?c.name:'-'}</div>
    <div style="display:flex;gap:14px;align-items:center;background:var(--panel-alt);border-radius:8px;padding:12px;margin-bottom:16px;">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(v.plate)}" width="70" height="70" style="border-radius:6px;background:#fff;padding:4px;" alt="QR ${v.plate}">
      <div style="font-size:11.5px;color:var(--text-muted);flex:1;">${en?"Scan this with any QR app to quickly get the plate number, then paste it into Global Search to instantly open this vehicle's record. Great to stick on the car or vehicle file.":'Imbas kod ini dengan mana-mana apl QR untuk dapatkan no. plat dengan pantas — kemudian tampal ke Carian Global untuk buka rekod kenderaan ini serta-merta. Sesuai dilekat pada kereta atau fail kenderaan.'}</div>
      <button class="btn-icon" data-action="print-vehicle-qr" data-id="${v.id}" title="${en?'Print QR':'Cetak QR'}">${ICONS.printer}</button>
    </div>
    ${(()=>{
      const nextKm = (v.lastServiceKm||0) + (v.serviceIntervalKm||10000);
      const kmLeft = nextKm - (v.odometer||0);
      if(!v.serviceIntervalKm) return '';
      const due = kmLeft<=0;
      return `<div style="background:${due?'rgba(225,75,75,.12)':'var(--panel-alt)'};border:1px solid ${due?'var(--danger)':'var(--border)'};border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:12.5px;">
        ${ICONS.gauge} ${en?'Current odometer':'Odometer semasa'}: <strong>${(v.odometer||0).toLocaleString()} km</strong> ·
        ${due ? `<span style="color:var(--danger);font-weight:600;">${en?'Service overdue':'Servis tertunggak'} (${Math.abs(kmLeft).toLocaleString()} km ${en?'past schedule':'lepas jadual'})</span>` : `${en?'Next service in ~':'Servis seterusnya dalam ~'}${kmLeft.toLocaleString()} km`}
      </div>`;
    })()}
    ${events.length===0 ? emptyState(en?'No service history for this vehicle yet.':'Belum ada sejarah servis untuk kenderaan ini.') : `
    <div class="timeline">
      ${events.map(ev=>{
        if(ev.type==='job'){
          const j = ev.data;
          return `<div class="timeline-item">
            <div class="timeline-date">${fmtDateTime(j.createdAt)} · ${j.jobNo}</div>
            <div class="timeline-title">${t('nav_jobs')} — ${statusLabel[j.status]}</div>
            <div class="timeline-desc">${j.description||'-'} ${j.mechanic?(en?'· Mechanic: ':'· Mekanik: ')+j.mechanic:''}</div>
          </div>`;
        } else {
          const i = ev.data;
          const warrantyItems = i.items.filter(it=>{
            if(!it.refId) return false;
            const invItem = getItem(it.refId);
            return invItem && invItem.warrantyMonths>0;
          }).map(it=>{
            const invItem = getItem(it.refId);
            const expiry = i.createdAt + invItem.warrantyMonths*30*24*3600*1000;
            const active = expiry > Date.now();
            return `${it.name} (${en?'warranty':'waranti'} ${invItem.warrantyMonths}${en?'mo':'bln'}, ${active?(en?'valid until ':'sah hingga ')+fmtDate(expiry):(en?'expired ':'tamat ')+fmtDate(expiry)})`;
          });
          return `<div class="timeline-item">
            <div class="timeline-date">${fmtDateTime(i.createdAt)} · ${i.invoiceNo}</div>
            <div class="timeline-title">${tt('Invois')} — ${fmtRM(i.total)} <span style="color:var(--text-muted);font-weight:400;">(${i.payment})</span></div>
            <div class="timeline-desc">${i.items.map(it=>it.name+' ×'+it.qty).join(', ')}</div>
            ${warrantyItems.length>0 ? `<div style="font-size:11px;color:var(--accent);margin-top:4px;">${ICONS.gauge} ${warrantyItems.join(' · ')}</div>` : ''}
          </div>`;
        }
      }).join('')}
    </div>`}
    <div class="modal-foot">
      <button class="btn btn-outline" data-action="close-modal">${t('btn_close')}</button>
    </div>
  `;
}

  </div>

  <div class="panel" style="margin-top:20px;">
    <h2>${tt('Sejarah Invois')} <span class="tag">${db.invoices.length}</span></h2>
    ${db.invoices.length===0 ? emptyState(tt('Belum ada invois dikeluarkan.')) : `

      <thead><tr><th>${tt('No. Invois')}</th><th>${tt('Pelanggan')}</th><th>${tt('Tarikh')}</th><th>${tt('Bayaran')}</th><th>${tt('Jumlah')}</th><th></th></tr></thead>

/* ============================= REPORTS VIEW ============================= */
function viewReports(){
  const now = Date.now();
  const rangeMs = state.reportRange*24*3600*1000;
  const invInRange = db.invoices.filter(i=>now-i.createdAt<=rangeMs);
  const totalSales = invInRange.reduce((s,i)=>s+i.total,0);
  const avgTicket = invInRange.length ? totalSales/invInRange.length : 0;
  const jobsInRange = db.jobs.filter(j=>now-j.createdAt<=rangeMs);
  const jobsCompleted = jobsInRange.filter(j=>j.status==='done'||j.status==='delivered').length;

  // top items sold
  const itemSales = {};
  invInRange.forEach(inv=>inv.items.forEach(it=>{
    itemSales[it.name] = (itemSales[it.name]||0) + it.price*it.qty;
  }));
  const topItems = Object.entries(itemSales).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // P&L: revenue vs cost of goods sold
  let cogs = 0, revenue = 0;
  invInRange.forEach(inv=>{
    revenue += inv.subtotal - (inv.discount||0);
    inv.items.forEach(it=>{
      if(it.refId){
        const invItem = getItem(it.refId);
        if(invItem) cogs += (invItem.cost||0) * it.qty;
      }
    });
  });
  const grossProfit = revenue - cogs;
  const marginPct = revenue>0 ? (grossProfit/revenue*100) : 0;
  const maxVal = topItems.length ? topItems[0][1] : 1;

  // mechanic performance
  const mechStats = {};
  jobsInRange.forEach(j=>{
    if(!j.mechanic) return;
    if(!mechStats[j.mechanic]) mechStats[j.mechanic] = {count:0, totalMs:0, doneCount:0, revenue:0};
    mechStats[j.mechanic].count++;
    if(j.doneAt){
      mechStats[j.mechanic].totalMs += (j.doneAt - j.createdAt);
      mechStats[j.mechanic].doneCount++;
    }
  });
  const jobsById = new Map(db.jobs.map(j=>[j.id, j]));
  invInRange.forEach(inv=>{
    if(!inv.jobId) return;
    const job = jobsById.get(inv.jobId);
    if(job && job.mechanic && mechStats[job.mechanic]) mechStats[job.mechanic].revenue += inv.total;
  });
  const mechRows = Object.entries(mechStats).map(([name,st])=>{
    const staffMember = db.staff.find(s=>s.name===name);
    const commissionPct = staffMember ? (staffMember.commissionPercent||0) : 0;
    return [name, {...st, commission: st.revenue*commissionPct/100, commissionPct}];
  }).sort((a,b)=>b[1].count-a[1].count);

  // stock forecast: qty sold per item over range / range days = daily burn rate
  const itemQtySold = {};
  invInRange.forEach(inv=>inv.items.forEach(it=>{
    if(!it.refId) return;
    itemQtySold[it.refId] = (itemQtySold[it.refId]||0) + it.qty;
  }));
  const forecastRows = db.inventory.map(i=>{
    const sold = itemQtySold[i.id]||0;
    const dailyRate = sold / state.reportRange;
    const daysLeft = dailyRate>0 ? Math.round(i.qty/dailyRate) : null;
    return {item:i, dailyRate, daysLeft};
  }).filter(r=>r.dailyRate>0).sort((a,b)=>(a.daysLeft||999)-(b.daysLeft||999)).slice(0,6);

  return `
  <div class="section-head">
    <div><div class="sub">${tt('Ringkasan prestasi bengkel')}</div></div>
    <div class="tabs" style="margin-bottom:0;">
      <div class="tab-btn ${state.reportRange===7?'active':''}" data-range="7">${tt('7 Hari')}</div>
      <div class="tab-btn ${state.reportRange===30?'active':''}" data-range="30">${tt('30 Hari')}</div>
      <div class="tab-btn ${state.reportRange===90?'active':''}" data-range="90">${tt('90 Hari')}</div>
    </div>
  </div>
  <div class="grid grid-3" style="margin-bottom:20px;">
    <div class="stat-card ok"><div class="stat-label">${tt('Jumlah Jualan')}</div><div class="stat-value">${fmtRM(totalSales)}</div><div class="stat-sub">${invInRange.length} ${tt('invois')}</div></div>
    <div class="stat-card"><div class="stat-label">${tt('Purata Setiap Invois')}</div><div class="stat-value">${fmtRM(avgTicket)}</div></div>
    <div class="stat-card"><div class="stat-label">${tt('Kerja Disiapkan')}</div><div class="stat-value">${jobsCompleted}</div></div>
  </div>

  ${db.settings.simpleMode ? '' : `
  <div class="panel" style="margin-bottom:20px;">
    <h2>${ICONS.gauge} ${tt('Untung/Rugi (P&L)')}</h2>
    <div class="grid grid-3">
      <div class="stat-card"><div class="stat-label">${tt('Hasil (Revenue)')}</div><div class="stat-value">${fmtRM(revenue)}</div></div>
      <div class="stat-card warn"><div class="stat-label">${tt('Kos Barangan (COGS)')}</div><div class="stat-value">${fmtRM(cogs)}</div></div>
      <div class="stat-card ok"><div class="stat-label">${tt('Untung Kasar')}</div><div class="stat-value">${fmtRM(grossProfit)}</div><div class="stat-sub">${tt('Margin')} ${marginPct.toFixed(1)}%</div></div>
    </div>
  </div>`}

  <div class="panel" style="margin-bottom:20px;">
    <h2>${ICONS.reports} ${tt('Trend Jualan')}</h2>
    ${renderSalesChart(invInRange, state.reportRange)}
  </div>

  <div class="grid grid-2">
    <div class="panel">
      <h2>${tt('Item / Servis Terlaris')}</h2>
      ${topItems.length===0 ? emptyState(tt('Belum cukup data jualan.')) : topItems.map(([name,val])=>`
        <div class="chart-bar-row">
          <div class="chart-bar-label">${name}</div>
          <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${(val/maxVal*100).toFixed(0)}%"></div></div>
          <div class="chart-bar-val">${fmtRM(val)}</div>
        </div>`).join('')}
    </div>
    ${db.settings.simpleMode ? '' : `
    <div class="panel">
      <h2>${ICONS.staff} ${tt('Prestasi Mekanik')}</h2>
      ${mechRows.length===0 ? emptyState(tt('Belum ada data mekanik.')) : `
      <div class="table-wrap"><table>
        <thead><tr><th>${tt('Mekanik')}</th><th>${tt('Kerja')}</th><th>${tt('Purata Masa Siap')}</th><th>${tt('Komisen')}</th></tr></thead>
        <tbody>
          ${mechRows.map(([name,st])=>`
            <tr>
              <td style="font-weight:600;">${name}</td>
              <td>${st.count}</td>
              <td>${st.doneCount>0 ? Math.round(st.totalMs/st.doneCount/3600000)+' '+tt('jam') : '-'}</td>
              <td style="color:var(--accent);font-weight:600;">${st.commissionPct>0 ? fmtRM(st.commission) : '-'}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>`}
    </div>`}
  </div>

  ${db.settings.simpleMode ? '' : `
  <div class="panel" style="margin-top:20px;">
    <h2>${ICONS.gauge} ${tt('Ramalan Stok (berdasarkan kadar jualan')} ${state.reportRange} ${tt('hari terakhir)')}</h2>
    ${forecastRows.length===0 ? emptyState(tt('Tiada data jualan mencukupi untuk ramalan.')) : `
    <div class="table-wrap"><table>
      <thead><tr><th>${tt('Item')}</th><th>${tt('Baki')||'Baki'}</th><th>${tt('Kadar Jualan/Hari')}</th><th>${tt('Anggaran Tempoh Habis')}</th></tr></thead>

function getChurnedCustomers(){
  const now = Date.now();
  const churnMs = (db.settings.churnDays||180)*24*3600*1000;
  // Build last-visit index in a single pass instead of filtering per customer (was O(n*m))
  const lastVisit = new Map();
  db.invoices.forEach(i=>{
    if(!i.customerId) return;
    const cur = lastVisit.get(i.customerId);
    if(!cur || i.createdAt>cur) lastVisit.set(i.customerId, i.createdAt);
  });
  db.jobs.forEach(j=>{
    if(!j.customerId) return;
    const cur = lastVisit.get(j.customerId);
    if(!cur || j.createdAt>cur) lastVisit.set(j.customerId, j.createdAt);
  });
  const rows = [];
  db.customers.forEach(c=>{
    const lastDate = lastVisit.get(c.id);
    if(lastDate===undefined) return; // never visited, not "churned"
    if(now-lastDate >= churnMs){
      rows.push({customer:c, lastDate, daysSince: Math.floor((now-lastDate)/(24*3600*1000))});
    }
  });
  return rows.sort((a,b)=>b.daysSince-a.daysSince).slice(0,15);
}

function renderSalesChart(invoices, rangeDays){
  const buckets = Math.min(rangeDays, 30); // cap visual bars for readability
  const bucketDays = Math.ceil(rangeDays/buckets);
  const now = new Date(); now.setHours(0,0,0,0);
  const data = [];
  for(let i=buckets-1;i>=0;i--){
    const endOffset = i*bucketDays;
    const startOffset = endOffset+bucketDays;
    const endTs = now.getTime()-endOffset*24*3600*1000+24*3600*1000;
    const startTs = now.getTime()-startOffset*24*3600*1000;
    const sum = invoices.filter(inv=>inv.createdAt>=startTs && inv.createdAt<endTs).reduce((s,inv)=>s+inv.total,0);
    data.push({label: fmtDate(endTs-1), value: sum});
  }
  const max = Math.max(...data.map(d=>d.value), 1);
  const w = 720, h = 160, padL=6, padR=6, barGap=4;
  const barW = (w-padL-padR)/data.length - barGap;
  const bars = data.map((d,idx)=>{
    const barH = (d.value/max)*(h-24);
    const x = padL + idx*(barW+barGap);
    const y = h-24-barH;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="var(--accent)" opacity="0.9"><title>${d.label}: ${fmtRM(d.value)}</title></rect>`;
  }).join('');
  const labels = data.length<=12 ? data.map((d,idx)=>{
    const x = padL + idx*(barW+barGap) + barW/2;
    return `<text x="${x.toFixed(1)}" y="${h-6}" font-size="9" fill="var(--text-muted)" text-anchor="middle">${d.label.split(' ')[0]}</text>`;
  }).join('') : '';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:170px;overflow:visible;">${bars}${labels}</svg>`;
}

    let drawing = false;
    const getPos = (e)=>{
      const rect = sigPad.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {x: cx-rect.left, y: cy-rect.top};
    };
    const start = (e)=>{ drawing=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
    const move = (e)=>{ if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
    const end = ()=>{ drawing=false; };
    sigPad.addEventListener('mousedown', start);
    sigPad.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    sigPad.addEventListener('touchstart', start, {passive:false});
    sigPad.addEventListener('touchmove', move, {passive:false});
    sigPad.addEventListener('touchend', end);
  }

  bindAllAction('cart-dec', el=>{
    const row = state.posCart[el.dataset.idx];
    row.qty = Math.max(1,row.qty-1);
    render();
  });
  bindAllAction('cart-remove', el=>{ state.posCart.splice(el.dataset.idx,1); render(); });

  const posCustomerSel = document.getElementById('pos-customer');
  if(posCustomerSel) posCustomerSel.addEventListener('change', ()=>{
    state.posCustomerId = posCustomerSel.value; state.posVehicleId=''; render();
  });
  const posVehicleSel = document.getElementById('pos-vehicle');
  if(posVehicleSel) posVehicleSel.addEventListener('change', ()=>{
    state.posVehicleId = posVehicleSel.value;
  });

  bindAction('close-cash', ()=>{
    const actual = Number(document.getElementById('cash-actual').value);
    if(isNaN(actual)){ showToast(tt('Sila masukkan jumlah tunai.')); return; }
    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    const dateStr = todayStart.toISOString().slice(0,10);
    const expected = db.invoices.filter(inv=>inv.createdAt>=todayStart.getTime() && inv.payment==='Tunai').reduce((s,i)=>s+i.total,0);
    db.cashClosures.push({id:uid(), date:dateStr, expected, actual, closedBy: state.currentStaff?state.currentStaff.name:'', closedAt:Date.now()});
    logAudit('Tutup Kunci Tunai', dateStr+': jangka '+fmtRM(expected)+' vs sebenar '+fmtRM(actual));
    queueSave();
    render();
    showToast(tt('Kunci tunai hari ini ditutup.'));
  });
  bindAction('checkout', ()=>{
    if(state.posCart.length===0) return;
    const payment = document.getElementById('pos-payment').value;
    // deduct inventory
    state.posCart.forEach(c=>{
      if(c.refId){
        const item = getItem(c.refId);
        if(item) item.qty = Math.max(0, item.qty-c.qty);
      }
    });
    const subtotal = state.posCart.reduce((s,c)=>s+c.price*c.qty,0);
    let discountAmt = 0;
    if(state.posDiscountType==='percent') discountAmt = subtotal * (Number(state.posDiscountValue)||0) / 100;
    else discountAmt = Number(state.posDiscountValue)||0;
    discountAmt = Math.min(Math.max(discountAmt,0), subtotal);
    const afterDiscount = subtotal - discountAmt;
    const taxRate = Number(db.settings.taxRate)||0;
    const taxAmt = afterDiscount * taxRate/100;
    const total = afterDiscount + taxAmt;
    const invoice = {
      id:uid(), invoiceNo:nextInvNo(), customerId:state.posCustomerId||null, vehicleId:state.posVehicleId||null,
      jobId: state.posJobId||null, items:[...state.posCart], subtotal, discount:discountAmt, taxRate, tax:taxAmt, total, payment, createdAt:Date.now(),
      createdBy: state.currentStaff ? state.currentStaff.name : '', branchId: state.currentBranch!=='all' ? state.currentBranch : db.branches[0].id
    };
    db.invoices.push(invoice);
    logAudit('Jana Invois', invoice.invoiceNo+' — '+fmtRM(invoice.total));
    if(state.posCustomerId){
      const cust = getCustomer(state.posCustomerId);
      if(cust){
        cust.visits = (cust.visits||0)+1;
        cust.loyaltyPoints = (cust.loyaltyPoints||0)+1;
      }
    }
    if(state.posJobId){
      const job = db.jobs.find(j=>j.id===state.posJobId);
      if(job){ job.invoiced = true; job.status='delivered'; }
    }
    queueSave();
    state.posCart = []; state.posCustomerId=''; state.posVehicleId=''; state.posJobId=''; state.posDiscountValue=0; state.posDiscountType='flat';
    render();
    showToast(tt('Invois ')+invoice.invoiceNo+tt(' berjaya dijana!'));
  });

  bindAllAction('print-invoice', el=>{
    const invoice = db.invoices.find(i=>i.id===el.dataset.id);
    if(invoice) printInvoice(invoice);
  });
  bindAllAction('print-jobcard', el=>{
    const job = db.jobs.find(j=>j.id===el.dataset.id);
    if(job) printJobCard(job);
  });
  bindAllAction('print-vehicle-qr', el=>{
    const vehicle = getVehicle(el.dataset.id);
    if(vehicle) printVehicleQR(vehicle);
  });

  const posSearch = document.getElementById('pos-search');
  if(posSearch){
    posSearch.addEventListener('input', ()=>{
      document.getElementById('pos-item-list').innerHTML = renderPOSItemList(posSearch.value);
      document.querySelectorAll('[data-action="add-to-cart"]').forEach(el=>el.addEventListener('click', ()=>{
        const item = getItem(el.dataset.id);
        const existing = state.posCart.find(c=>c.refId===item.id);
        if(existing) existing.qty++;
        else state.posCart.push({refId:item.id, name:item.name, price:item.price, qty:1});
        render();
      }));
    });
  }

  const posBarcode = document.getElementById('pos-barcode');
  if(posBarcode){
    posBarcode.focus();
    posBarcode.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const code = posBarcode.value.trim();
        if(!code) return;
        const item = db.inventory.find(i=>i.sku.toLowerCase()===code.toLowerCase());
        if(item){
          const existing = state.posCart.find(c=>c.refId===item.id);
          if(existing) existing.qty++;
          else state.posCart.push({refId:item.id, name:item.name, price:item.price, qty:1});
          render();
          showToast(item.name+tt(' ditambah ke troli.'));
        } else {
          showToast(tt('Tiada item dengan kod "')+code+'".');
          posBarcode.value='';
        }
      }
    });
  }

  const discType = document.getElementById('pos-discount-type');
  const discVal = document.getElementById('pos-discount-value');
  if(discType) discType.addEventListener('change', ()=>{ state.posDiscountType = discType.value; render(); });
  bindAction('apply-loyalty-discount', ()=>{
    state.posDiscountType = 'percent';
    state.posDiscountValue = Number(db.settings.loyaltyDiscount)||0;
    render();
    showToast(tt('Diskaun setia digunakan.'));
  });
  if(discVal) discVal.addEventListener('input', ()=>{ state.posDiscountValue = discVal.value; render(); focusEnd('pos-discount-value'); });
}

function focusEnd(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  const supportsSelection = ['text','search','url','tel','password'].includes(el.type);
  if(supportsSelection && el.setSelectionRange){
    try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){ /* ignore unsupported input types */ }
  }
}

function downloadCSV(filename, headers, rows){
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))];
  const blob = new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast(tt('Fail ')+filename+tt(' dimuat turun.'));
}

function bindAction(name, fn){
  const el = document.querySelector(`[data-action="${name}"]`);
  if(el) el.addEventListener('click', fn);
}
function bindAllAction(name, fn){
  document.querySelectorAll(`[data-action="${name}"]`).forEach(el=>el.addEventListener('click', ()=>fn(el)));
}

/* ============================= INIT ============================= */
/* ============================= KEYBOARD SHORTCUTS ============================= */
['mousemove','mousedown','keydown','touchstart','scroll'].forEach(evt=>{
  document.addEventListener(evt, ()=>resetInactivityTimer(), {passive:true});
});
document.addEventListener('keydown', (e)=>{
  if(state.currentStaff && !state.kioskMode && state.view==='pos' && (e.ctrlKey||e.metaKey) && e.key==='Enter'){
    const btn = document.querySelector('[data-action="checkout"]');
    if(btn && !btn.disabled){ e.preventDefault(); btn.click(); }
  }
});

/* ============================= INIT ============================= */
loadDB();
</script>
