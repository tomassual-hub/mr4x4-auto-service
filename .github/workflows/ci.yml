name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm run build

      # Runs against an isolated test-only Supabase project (see
      # tests/README.md and build/build-test.js) — never the production
      # backend the live shop uses. inventory-po-backup.test.js has a
      # known, pre-existing timing flake against that live backend
      # (confirmed many times to be environmental, not a real regression:
      # it always passes clean on an isolated rerun). One retry absorbs
      # that without masking an actual, consistent failure.
      - run: npm test || npm test

  deploy-pages:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # GitHub Pages runs Jekyll processing by default — .nojekyll opts out
      # (also skips any accidental _-prefixed file being treated specially).
      - run: touch "servispro-pwa/.nojekyll"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "servispro-pwa"

      - id: deployment
        uses: actions/deploy-pages@v4
