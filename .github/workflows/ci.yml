name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm run build

      # Runs against the shared live Supabase test account (see
      # tests/README.md) — same account and same backend the test suite
      # already uses when run locally, just now on every push/PR too.
      # inventory-po-backup.test.js has a known, pre-existing timing flake
      # against that live backend (confirmed many times to be environmental,
      # not a real regression: it always passes clean on an isolated rerun).
      # One retry absorbs that without masking an actual, consistent failure.
      - run: npm test || npm test
